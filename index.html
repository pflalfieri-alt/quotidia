<style>
:root{--blu:#2E3648;--blu2:#3b4660;--or:#F28C00;--bg:#d5deee;--tx:#1d2330;--mu:#6b7385;--ok:#1a8f4c;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg) linear-gradient(180deg,#c3d0e8 0%,#d3dcee 45%,#e1e8f4 100%) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--blu);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 22px 22px}
header .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{font-size:1.05rem;letter-spacing:.2px}header span.pt{color:var(--or)}
header small{opacity:.8}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(20,30,50,.08)}
h1{font-size:1.35rem;margin:0 0 6px}h2{font-size:1.05rem;margin:0 0 10px}p{margin:0 0 10px}
.mu{color:var(--mu);font-size:.9rem}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid #d6d9e2;border-radius:12px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--or);color:#fff;margin-top:14px;cursor:pointer}
.dt summary{font-weight:700;font-size:1.05rem;cursor:pointer;list-style:none}.dt summary::after{content:' ▾';color:var(--or)}.dt[open] summary::after{content:' ▴'}.dt>*:not(summary){margin-top:10px}
.btn.sec{background:var(--blu);color:#fff}.btn.wa{background:#1fa855}
.btn:disabled{opacity:.6}
.row{display:flex;gap:10px}.row>*{flex:1}
.cred{background:linear-gradient(135deg,var(--blu),var(--blu2));color:#fff;text-align:center;padding:22px 16px}
.cred .n{font-size:3rem;font-weight:800;line-height:1;color:#fff}.cred .n small{font-size:1rem;opacity:.85;font-weight:600}
.stats{display:flex;gap:10px;margin-top:14px}.stats div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:1.3rem}
.link{background:#f1f2f7;border-radius:12px;padding:12px;word-break:break-all;font-size:.9rem}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:.85rem;color:var(--mu)}.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eceef4}.item:last-child{border:0}
.tag{font-size:.75rem;padding:4px 10px;border-radius:99px;background:#e9ebf2;color:var(--blu);white-space:nowrap}.tag.ok{background:#dff3e7;color:var(--ok)}.tag.or{background:#fdecd2;color:#a85d00}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;border-top:1px solid #e3e5ec;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font:inherit;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:1.3rem}nav button.on{color:var(--or);font-weight:700}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;margin:6px 0;font-size:.95rem;white-space:pre-wrap}
.msg.u{background:var(--blu);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.msg.t{background:#eceef4;border-bottom-left-radius:4px}
.err{color:#b3261e;font-size:.9rem;margin-top:8px;min-height:1.2em}
.foot{text-align:center;color:var(--mu);font-size:.78rem;margin:20px 0 0}
@media(max-width:480px){.hl{gap:6px!important;min-width:0}#lg{height:44px!important;width:44px!important}.wm{height:36px!important;max-width:42vw}.hr svg{height:36px!important}.hr div{font-size:.56rem!important;max-width:78px!important}.hr div b{font-size:.78rem!important}.top{gap:6px}}
.foot a{color:var(--or);text-decoration:none;font-weight:600}
.wm{padding-left:10px;border-left:1px solid rgba(255,255,255,.22)}
.hide{display:none!important}


body{background:linear-gradient(160deg,#2E3648 0%,#3d4470 55%,#6a4f7e 100%) fixed!important}
.foot,.foot a,.foot span,.foot small,.foot b{color:#e6e9f6!important}
.foot img{background:transparent;padding:0}
.card,.foot-card{background:rgba(255,255,255,.9)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 30px rgba(20,18,50,.25)!important;border-radius:22px!important}
.card .mu,.card small{color:var(--mu)!important}
.card{color:var(--tx)}
.card.cred .mu,.card.cred small,.card[style*="background:#2E"] .mu,.card[style*="background:#2E"] small,.card[style*="background:#2E"] p{color:#fff!important;opacity:.9}
img[alt^="Numero Verde"]{background:transparent!important;padding:0!important}
.card.dk,.card.cred,.card[style*="gradient"],.card[style*="background:var(--blu"],.card[style*="background:#2E"]{background:linear-gradient(135deg,#2E3648,#3b4660)!important;color:#fff!important}
.card.dk *,.card.cred *,.card[style*="gradient"] *,.card[style*="background:var(--blu"] *,.card[style*="background:#2E"] *{color:inherit}
.card img[alt^="Numero Verde"]{background:#2E3648!important;border-radius:14px;padding:6px 12px!important;box-sizing:border-box}
html{background:#2E3648;min-height:100%}
@media(min-width:900px){
main{max-width:780px!important}
header{padding-left:max(18px,calc((100vw - 1060px)/2))!important;padding-right:max(18px,calc((100vw - 1060px)/2))!important}
body[data-tab=home] main{max-width:1060px!important;display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
body[data-tab=home] main>.card.cred{grid-column:1/-1}
nav{left:50%!important;right:auto!important;transform:translateX(-50%);width:min(820px,100%);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(20,18,50,.25)}
nav button{font-size:.8rem!important}
}
.card.gua{background:linear-gradient(135deg,#F28C00,#E86A00)!important;color:#fff!important;border-color:rgba(255,255,255,.4)}.card.gua p,.card.gua h2{color:#fff!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2E3648"></head><body>

var CORSI={"S": {"titolo": "Corso Segnalatori", "moduli": [{"t": "Lezione 1 – Cos'è Quotidia e chi c'è dietro", "l": [{"t": "Lezione 1 – Cos'è Quotidia e chi c'è dietro", "p": ["Benvenuto nel corso per i segnalatori di Quotidia. In queste lezioni impari tutto quello che serve per consigliare i nostri percorsi alle persone che conosci e guadagnare crediti da trasformare in premi. Partiamo dalle basi: che cos'è Quotidia e chi c'è dietro.", "Quotidia è l'app di UniAC. È gratuita e funziona dal telefono, senza passare dagli store. Dentro trovi notizie utili su scuola, università e lavoro, strumenti per capire quale percorso serve, il catalogo dei corsi e Nikyta, l'assistente che risponde alle domande. E c'è l'area per chi, come te, vuole segnalare persone interessate.", "Dietro Quotidia c'è UniAC, che lavora insieme a PFL Group, ente di formazione accreditato dalla Regione Calabria, certificato ISO 9001 ed ente attuatore del fondo interprofessionale Fonditalia. Con le università telematiche partner proponiamo lauree e master; con PFL Group corsi di qualifica, certificazioni per la scuola, corsi sulla sicurezza sul lavoro e formazione finanziata per le aziende. In ogni iscrizione c'è un tutor che segue la persona dall'inizio alla fine.", "Il tuo ruolo è semplice. Tu conosci persone che hanno bisogno di un titolo, di punteggio per le graduatorie, di una qualifica per lavorare. Le segnali con l'app. Un nostro tutor le chiama, le orienta e, se decidono di iscriversi, tu ricevi i crediti. Non devi vendere, non devi spiegare i dettagli tecnici, non tocchi soldi.", "Nel corso vediamo: come attivare l'app, cosa offriamo, come fare una segnalazione, come funzionano crediti e premi, come costruire la tua squadra di segnalatori e le regole da rispettare. Alla fine c'è un breve quiz.", "Nella prossima lezione vediamo cosa fa un segnalatore, e soprattutto cosa non deve fare."], "v": "corsi/S1.mp4"}]}, {"t": "Lezione 2 – Cosa fa il segnalatore", "l": [{"t": "Lezione 2 – Cosa fa il segnalatore", "p": ["Il segnalatore è un ponte. Mette in contatto una persona che ha un bisogno con chi può aiutarla. Vediamo cosa fai tu e cosa fa UniAC.", "Tu: ascolti le persone, capisci se hanno un bisogno legato a studio o lavoro, chiedi il permesso di farle contattare e inserisci la segnalazione in Quotidia. UniAC: chiama la persona, verifica i requisiti, propone il percorso giusto, gestisce iscrizione e pagamento, segue la persona fino al titolo.", "Ci sono quattro cose che un segnalatore non fa mai. Primo: non incassa soldi, né acconti né rate. Si paga solo all'ente, sui conti ufficiali. Secondo: non promette risultati, come punteggi sicuri, posti di lavoro o esami facili. Terzo: non inserisce persone che non hanno dato il consenso a essere contattate. Quarto: non manda messaggi in massa a sconosciuti.", "Queste regole proteggono te, le persone che segnali e il nome di UniAC. Una segnalazione fatta bene vale più di dieci fatte di corsa: la persona arriva già informata, si fida, e la probabilità che si iscriva cresce.", "Un'ultima cosa importante. Questo corso è per i privati, che ricevono crediti e premi. Se hai una partita IVA, per esempio sei un professionista, un consulente o hai un'attività, non sei un segnalatore ma un partner: entri nella sezione CAF e agenzie, firmi la Convenzione con UniAC e ricevi compensi in euro con fattura. In quel caso scrivi al numero WhatsApp di UniAC e ti attiviamo come partner.", "Nella prossima lezione vediamo quanto si guadagna."], "v": "corsi/S2.mp4"}]}, {"t": "Lezione 3 – Quanto si guadagna", "l": [{"t": "Lezione 3 – Quanto si guadagna", "p": ["Con Quotidia non ricevi soldi, ricevi crediti. Un credito vale un euro di premio: buoni acquisto, carte regalo e altri premi del catalogo. Vediamo come si calcolano.", "Quando una persona che hai segnalato si iscrive e paga, ricevi il dieci per cento dell'importo pagato, senza l'IVA. Esempio: un corso da 244 euro IVA inclusa vale 200 euro senza IVA. A te vanno 20 crediti. Per la tua prima iscrizione c'è anche un bonus di 5 crediti.", "Più iscrizioni porti nello stesso mese, più sali di livello. Da tre iscrizioni nel mese diventi Agente e ricevi crediti extra su ogni iscrizione. Da dieci diventi Orientatore e gli extra aumentano. Trovi sempre il tuo livello nella Home dell'app.", "C'è poi la squadra. Se inviti altre persone a diventare segnalatori con il tuo link, entrano nella tua squadra. Su ogni iscrizione portata da loro ricevi il cinque per cento, sempre senza IVA, in aggiunta ai tuoi crediti. Vale solo per i segnalatori che inviti tu direttamente, non per quelli che invitano loro. E non guadagni nulla per il solo fatto di aver invitato qualcuno: contano solo le iscrizioni vere.", "Un esempio: un segnalatore della tua squadra porta l'iscrizione a una laurea da 2.600 euro, che non ha IVA. Lui riceve 260 crediti, tu 130.", "I crediti diventano utilizzabili 30 giorni dopo il pagamento dell'iscritto e non scadono. Puoi chiedere un premio quando ne hai almeno 25. I premi arrivano via email.", "Fine del primo modulo. Nel prossimo installiamo Quotidia sul telefono e creiamo il tuo account."], "v": "corsi/S3.mp4"}]}, {"t": "Lezione 4 – Installare e registrarsi", "l": [{"t": "Lezione 4 – Installare e registrarsi", "p": ["Quotidia non si scarica dagli store: si apre dal browser del telefono e si aggiunge alla schermata Home, come un'app normale. Ci vuole un minuto.", "Su iPhone apri Safari e scrivi quotidia punto pflgroup punto org. Quando la pagina è aperta, tocca il pulsante Condividi, il quadrato con la freccia in alto, scorri e scegli \"Aggiungi alla schermata Home\". Conferma con \"Aggiungi\".", "Su Android apri Chrome, vai allo stesso indirizzo, tocca i tre puntini in alto a destra e scegli \"Installa app\" oppure \"Aggiungi a schermata Home\".", "Ora trovi l'icona di Quotidia tra le tue app. Da qui in avanti aprila sempre dall'icona. Se qualcuno ti ha mandato un link di invito, aprilo prima di registrarti: così entri nella sua squadra.", "Nella prossima lezione creiamo il tuo account.", "Per registrarti servono nome, cognome, numero di cellulare e un PIN che scegli tu. L'email è facoltativa ma utile: ti arrivano gli avvisi e i premi.", "Leggi il Regolamento e l'informativa privacy, poi spunta la casella di consenso. Il PIN tienilo per te: serve a entrare insieme al numero di telefono. Se arrivi da un link di invito, vedrai già indicato chi ti ha invitato.", "Fatto. Hai il tuo codice personale: è quello che lega a te le persone che segnali e i segnalatori che inviti.", "Se dimentichi il PIN, scrivi al tuo gestore o al numero WhatsApp di UniAC.", "Al primo accesso Quotidia ti chiede chi sei. Scegli \"Voglio guadagnare segnalando\": la Home si organizza per il tuo lavoro di segnalatore.", "In alto trovi la scheda \"Come guadagni con Quotidia\", i tuoi crediti disponibili, quelli in maturazione e il tuo livello del mese.", "Qui c'è il pulsante per fare una segnalazione e, sotto, l'elenco delle persone che hai segnalato con il loro stato.", "In \"Porta altri segnalatori\" trovi il tuo link di invito e i numeri della tua squadra. Ne parliamo nel modulo 6.", "Nel menu trovi il Catalogo dei corsi, gli strumenti per capire cosa serve a una persona, Nikyta per le domande veloci e la pagina Premi. Prenditi qualche minuto per esplorare: più conosci l'app, più sei sicuro quando parli con qualcuno.", "Fine del modulo 2. Nel prossimo vediamo cosa offriamo e a chi."], "v": "corsi/S4.mp4"}]}, {"t": "Lezione 5 – Cosa offriamo", "l": [{"t": "Lezione 5 – Cosa offriamo", "p": ["Non devi conoscere ogni corso a memoria: ai dettagli pensa il tutor. Devi però riconoscere le grandi famiglie, per capire quando una persona può avere bisogno di noi. Sono sei.", "Uno: lauree triennali, magistrali e master online con le università telematiche partner, come eCampus e Link. Adatti a chi lavora, perché si studia quando si vuole e si fanno gli esami nelle sedi d'esame.", "Due: chi insegna o vuole insegnare. Ci sono i percorsi abilitanti da 30, 36 e 60 CFU e i corsi che danno punteggio nelle graduatorie.", "Tre: chi lavora nella scuola come personale ATA o vuole entrarci. Certificazioni informatiche e linguistiche e titoli che aiutano a salire in graduatoria.", "Quattro: le qualifiche professionali riconosciute dalla Regione, per lavorare nel sociale, nella scuola, nei servizi e nei mestieri.", "Cinque: i corsi obbligatori per aziende e lavoratori. Sicurezza, HACCP per chi lavora con il cibo, antincendio, primo soccorso e i loro aggiornamenti.", "Sei: la formazione per le aziende, anche finanziata: PFL Group è ente attuatore del fondo interprofessionale Fonditalia. Se conosci un titolare d'azienda, può essere un contatto prezioso.", "Ricorda: i prezzi e le condizioni li dà sempre il tutor, perché cambiano nel tempo e dipendono dalla situazione della persona.", "Nel Catalogo trovi i corsi divisi per categoria, presi direttamente dal negozio online di UniAC. Ogni corso ha la sua scheda e il pulsante \"Invia\", per mandarla a una persona con il tuo codice già inserito.", "Negli Strumenti ci sono quiz e calcolatori per capire, per esempio, quanto punteggio può guadagnare un ATA o un docente. Puoi farli insieme alla persona: è un modo semplice per aprire il discorso. Per le domande veloci c'è Nikyta, l'assistente dell'app. Nikyta può sbagliare: per le decisioni importanti conta sempre il tutor."], "v": "corsi/S5.mp4"}]}, {"t": "Lezione 6 – La segnalazione", "l": [{"t": "Lezione 6 – La segnalazione", "p": ["La segnalazione migliore nasce da una buona domanda. Ecco le cinque che funzionano di più.", "Che lavoro fai, o che lavoro vorresti fare? Hai un diploma o una laurea? Sei in qualche graduatoria della scuola? C'è un titolo o un attestato che ti chiedono e non hai? Quanto tempo hai per studiare?", "Tre esempi. Tua cugina è collaboratrice scolastica e vorrebbe più punteggio: segnalala per l'area ATA. Il tuo vicino apre un bar: gli servono HACCP e sicurezza. Un amico diplomato lavora in ufficio e vuole crescere: può interessargli una laurea online.", "Non serve convincere nessuno. Basta chiedere: \"Ti va se ti faccio chiamare da un tutor, senza impegno?\". Se la risposta è sì, sei pronto per la segnalazione.", "Fine del modulo 3. Nel prossimo facciamo la prima segnalazione insieme.", "Ora facciamo una segnalazione insieme, con un contatto di prova. Dalla Home tocca \"Segnala una persona\".", "Scrivi nome e cognome, il numero di cellulare corretto e, se ce l'hai, l'email. In \"Interesse\" scegli l'area giusta e aggiungi una nota breve: per esempio \"ATA, vuole più punteggio\" oppure \"apre un bar, serve HACCP\". Due righe aiutano molto il tutor.", "Ora la cosa più importante: la casella del consenso. La spunti solo se la persona ti ha detto di sì, che vuole essere chiamata. Se non sei sicuro, chiediglielo prima.", "Tocca Invia. La segnalazione arriva subito ai nostri tutor e compare nel tuo elenco come \"Ricevuta\".", "C'è un secondo modo per segnalare: mandi alla persona il tuo link, e sarà lei a lasciare i suoi dati. Va bene quando preferisce decidere da sola.", "Dalla Home tocca \"Condividi\": si apre WhatsApp con un messaggio già scritto e il tuo link. Mandalo solo a persone che conosci e che ne hanno parlato con te.", "Se la persona è interessata a un corso preciso, aprilo nel Catalogo e tocca \"Invia\": riceve la scheda con il tuo codice. Se si iscrive dal negozio online, l'iscrizione resta tua."], "v": "corsi/S6.mp4"}]}, {"t": "Lezione 7 – Dopo la segnalazione: crediti e premi", "l": [{"t": "Lezione 7 – Dopo la segnalazione: crediti e premi", "p": ["Dopo l'invio, un tutor chiama la persona. Tu segui tutto dall'elenco \"I miei amici\": Ricevuta, Contattato, Appuntamento fissato, In lavorazione, Iscritto oppure Non proseguita.", "Quando lo stato diventa \"Iscritto\" e il pagamento è registrato, vedi i crediti accanto al nome. Se \"Non proseguita\", non scoraggiarti: capita, e magari quella persona tornerà tra qualche mese.", "Per rispetto della privacy vedi solo il nome di battesimo e lo stato, non i dettagli della pratica. Se una persona ti chiede informazioni sul suo percorso, rimandala al suo tutor.", "Fine del modulo 4. Nel prossimo vediamo crediti e premi nel dettaglio.", "Nella Home vedi due numeri. \"Crediti disponibili\" sono quelli che puoi già usare. \"In maturazione\" sono quelli in attesa: diventano disponibili 30 giorni dopo il pagamento dell'iscritto, dopo che UniAC ha verificato che l'iscrizione è reale.", "Ricapitoliamo: il dieci per cento sulle tue iscrizioni, il cinque per cento su quelle della tua squadra, 5 crediti di bonus alla prima iscrizione, e crediti extra quando sei Agente o Orientatore nel mese. Tutto calcolato sull'importo pagato senza IVA.", "Se un'iscrizione viene annullata e la persona è rimborsata, i crediti di quell'iscrizione vengono tolti. È un motivo in più per segnalare solo persone davvero interessate.", "Nella pagina Premi trovi buoni e carte regalo di tanti marchi. Ogni premio ha il suo costo in crediti. Puoi chiedere un premio quando hai almeno 25 crediti disponibili.", "Scegli il premio, conferma, e la richiesta compare in \"Le mie richieste\". Il premio arriva via email entro 15 giorni. Per questo è utile aver inserito l'email nel profilo.", "I crediti non si trasformano in denaro e non scadono. Fine del modulo 5. Nel prossimo: come costruire la tua squadra."], "v": "corsi/S7.mp4"}]}, {"t": "Lezione 8 – La tua squadra", "l": [{"t": "Lezione 8 – La tua squadra", "p": ["Da solo conosci un certo numero di persone. Con una squadra arrivi molto più lontano. Ogni segnalatore che inviti con il tuo link entra nella tua squadra, e su ogni iscrizione che porta ricevi il cinque per cento in crediti, oltre ai tuoi.", "Tre regole chiare. Uno: conta solo chi inviti tu direttamente, non chi invitano loro. Due: guadagni solo sulle iscrizioni pagate, non sul fatto di aver invitato qualcuno. Tre: entrare è gratis per tutti, nessuno paga nulla per far parte della squadra. Così il sistema resta corretto e trasparente.", "I segnalatori migliori sono persone che parlano ogni giorno con tanta gente: chi lavora in un negozio o in un bar, chi lavora nella scuola, rappresentanti di associazioni, sportivi, persone attive nella parrocchia o nel quartiere, ex studenti soddisfatti.", "Ecco un messaggio semplice: \"Ciao, uso un'app che si chiama Quotidia: se conosci qualcuno che ha bisogno di un corso, una laurea o punteggio per la scuola, lo segnali e ricevi crediti da usare in premi. È gratis, ti mando il link?\". Chiedi sempre prima di mandare il link.", "Non presentarlo come un lavoro o uno stipendio, non promettere cifre, e non dire che si guadagna invitando persone. Si guadagna aiutando persone a iscriversi.", "Nella Home apri \"Porta altri segnalatori\". Trovi il tuo link di invito: puoi copiarlo o toccare \"Invita su WhatsApp\". Chi apre il link e si registra entra nella tua squadra.", "Con \"La mia rete\" vedi chi si è registrato con il tuo link. Nella stessa sezione trovi quante iscrizioni ha portato la tua squadra e i crediti che ti ha fatto guadagnare.", "Importante: la persona deve registrarsi dal tuo link. Se si registra da sola, senza link, non entra nella tua squadra.", "Una squadra rende quando chi entra sa cosa fare. Tre consigli. Primo: manda al nuovo segnalatore il link a questo corso e chiedigli di guardare almeno i primi quattro moduli. Secondo: fate insieme la sua prima segnalazione, anche al telefono. Terzo: sentitevi ogni tanto, per condividere idee e dubbi.", "Fine del modulo 6. Manca l'ultimo: le regole e il quiz finale."], "v": "corsi/S8.mp4"}]}, {"t": "Lezione 9 – Regole e quiz", "l": [{"t": "Lezione 9 – Regole e quiz", "p": ["Chiudiamo con le cinque regole d'oro del segnalatore.", "Uno, il consenso: segnali solo chi ti ha detto di sì. Due, niente promesse: non garantire punteggi, esami o posti di lavoro. Tre, niente soldi: non ricevi pagamenti per conto di UniAC, mai. Quattro, niente spam: messaggi solo a persone che conosci, niente invii in massa e niente pubblicità a pagamento a nome di UniAC. Cinque, il marchio: usa i materiali che trovi nell'app, senza modificarli.", "Chi non rispetta queste regole può essere sospeso e perdere i crediti delle segnalazioni non corrette, come previsto dal Regolamento.", "Non sei mai solo. Per dubbi sull'app o sulle segnalazioni scrivi al tuo gestore, la persona di UniAC che ti segue. Per tutto il resto c'è il Numero Verde 800 598 033 e il WhatsApp 327 113 5171.", "Ora il quiz finale: dieci domande per verificare di avere tutto chiaro. Buon lavoro, e benvenuto in Quotidia."], "v": "corsi/S9.mp4"}]}], "quiz": [{"q": "Quando ricevi i crediti di una segnalazione?", "o": ["Quando la invii", "Quando la persona si iscrive e paga", "Quando il tutor la chiama"]}, {"q": "Quanto ricevi sulle tue iscrizioni?", "o": ["5%", "10% dell'importo senza IVA", "10% dell'importo con IVA"]}, {"q": "Quanto ricevi sulle iscrizioni della tua squadra?", "o": ["5%, solo dai segnalatori che inviti direttamente", "5% da tutti i livelli", "Nulla"]}, {"q": "Guadagni qualcosa solo per aver invitato un nuovo segnalatore?", "o": ["Sì, un bonus", "No, contano solo le iscrizioni pagate"]}, {"q": "Dopo quanti giorni i crediti diventano utilizzabili?", "o": ["Subito", "30 giorni dopo il pagamento", "Un anno"]}, {"q": "Da quanti crediti puoi chiedere un premio?", "o": ["10", "25", "100"]}, {"q": "Una persona vuole darti l'acconto in contanti. Cosa fai?", "o": ["Lo prendi e lo giri a UniAC", "Non lo prendi: si paga solo all'ente sui conti ufficiali"]}, {"q": "Puoi segnalare un amico senza chiedergli il permesso?", "o": ["Sì, se è interessato", "No, serve il suo consenso"]}, {"q": "Chi dà prezzi e condizioni?", "o": ["Il segnalatore", "Il tutor"]}, {"q": "Un nuovo segnalatore entra nella tua squadra se:", "o": ["Lo dici al tuo gestore", "Si registra dal tuo link di invito"]}]}, "P": {"titolo": "Corso Partner CAF e Agenzie", "moduli": [{"t": "Lezione 1 – La collaborazione", "l": [{"t": "Lezione 1 – La collaborazione", "p": ["Benvenuto nel corso per i partner CAF e agenzie di Quotidia. Ogni giorno al tuo sportello passano persone che hanno bisogno di qualcosa che noi offriamo: personale della scuola che vuole più punteggio, disoccupati che cercano una qualifica, lavoratori che vogliono una laurea, titolari che devono formare i dipendenti sulla sicurezza.", "Con Quotidia puoi offrire questi servizi senza costi, senza magazzino e senza seguire tu le pratiche. Tu segnali il cliente, i nostri tutor fanno il resto. Su ogni iscrizione ricevi un compenso, fatturato a UniAC.", "Dietro Quotidia ci sono UniAC e PFL Group, ente di formazione accreditato dalla Regione Calabria, certificato ISO 9001 ed ente attuatore del fondo interprofessionale Fonditalia, insieme alle università telematiche partner. Offriamo lauree e master, qualifiche, certificazioni per la scuola, corsi sulla sicurezza sul lavoro e formazione finanziata per le aziende. Ogni cliente che ci mandi viene seguito da un tutor dall'inizio alla fine.", "Questo corso vale per CAF, patronati, agenzie e per chiunque segnala con una partita IVA: professionisti, consulenti, titolari di attività. Chi ha la partita IVA lavora sempre come partner, con Convenzione e fattura, e non come segnalatore privato a crediti.", "La collaborazione si basa su quattro elementi. La Convenzione, che firmi con UniAC e che fissa percentuali, tempi di pagamento e regole. Il gestore, la persona di UniAC che ti segue e a cui fai riferimento per tutto. Le segnalazioni, che fai dall'Area Partner di Quotidia. E i compensi, che vedi in tempo reale nell'app.", "Il compenso matura solo sulle iscrizioni dei clienti che ci mandi. La percentuale cambia in base alla categoria del corso ed è scritta nella Convenzione. Si calcola sul prezzo pagato dal cliente, IVA inclusa.", "Due precisazioni importanti. Primo: come partner non guadagni reclutando altri CAF, agenzie o segnalatori. Il compenso arriva solo dalle iscrizioni. Secondo: un CAF o un'agenzia non può essere anche segnalatore, e viceversa. Sono due ruoli diversi, con regole diverse.", "Nella prossima lezione attiviamo il tuo accesso.", "Il primo passo è la Convenzione. Il tuo gestore te la manda già compilata con i dati della tua attività: ragione sociale, partita IVA, sede, referente. Controllali con attenzione: sono quelli che userai in fattura.", "Nella Convenzione trovi le percentuali per ogni categoria di corso, quando matura il compenso, i tempi di pagamento e le regole sulla privacy dei clienti. Leggila tutta prima di firmarla e chiedi al gestore se qualcosa non è chiaro."], "v": "corsi/P1.mp4"}]}, {"t": "Lezione 2 – Accesso e servizi", "l": [{"t": "Lezione 2 – Accesso e servizi", "p": ["Dopo la firma, il gestore crea il tuo profilo partner e ti comunica il PIN di accesso. Non devi registrarti da solo: il partner lo attiva sempre UniAC.", "Apri quotidia punto pflgroup punto org dal telefono e aggiungila alla schermata Home: su iPhone da Condividi, \"Aggiungi alla schermata Home\"; su Android dai tre puntini, \"Installa app\". Poi tocca Accedi e inserisci il numero di telefono indicato nella Convenzione e il PIN ricevuto. Dopo cinque tentativi sbagliati l'accesso si blocca per qualche minuto: in quel caso aspetta o chiama il gestore.", "Entrando vedi solo l'Area Partner, pensata per il tuo lavoro. Non ci sono crediti né premi: tu ricevi compensi in euro con fattura.", "Le sezioni sono quattro. \"Segnala un cliente\", per mandarci un contatto. \"I miei contatti\", con lo stato di ogni cliente segnalato. Il Catalogo, con le schede dei corsi da mandare ai clienti. E \"Compensi\", dove vedi quanto hai maturato, rata per rata, e cosa è già stato pagato.", "Nel prossimo modulo vediamo quali servizi proporre al tuo sportello.", "Non devi diventare un esperto di formazione. Devi riconoscere cinque situazioni frequenti al tuo sportello.", "Uno, la scuola. Chi presenta la domanda per le graduatorie ATA o è già in graduatoria può aumentare il punteggio con certificazioni informatiche e linguistiche e con titoli riconosciuti. Chi insegna o vuole insegnare può avere bisogno dei percorsi abilitanti da 30, 36 o 60 CFU.", "Due, chi lavora e vuole un titolo universitario. Lauree e master online con università telematiche partner, studiando quando si vuole.", "Tre, chi cerca lavoro o deve cambiarlo. Le qualifiche riconosciute dalla Regione: nel sociale, nella scuola, nei servizi, nei mestieri.", "Quattro, le imprese tue clienti. Ogni datore di lavoro deve formare i dipendenti su sicurezza, HACCP, antincendio e primo soccorso, e ripetere gli aggiornamenti. È un'occasione ricorrente.", "Cinque, le aziende più strutturate: possono formare i dipendenti con la formazione finanziata. PFL Group è ente attuatore del fondo interprofessionale Fonditalia, quindi spesso il corso non costa nulla all'azienda.", "Prezzi, requisiti e tempi li comunica sempre il tutor UniAC, perché dipendono dalla situazione del cliente."], "v": "corsi/P2.mp4"}]}, {"t": "Lezione 3 – Dal cliente alla segnalazione", "l": [{"t": "Lezione 3 – Dal cliente alla segnalazione", "p": ["Vediamo quattro momenti tipici. Un cliente compila la domanda ATA: chiedigli se vuole sapere come aumentare il punteggio. Un cliente presenta la NASpI o cerca lavoro: chiedigli se gli interessa una qualifica. Un dipendente pubblico vuole fare carriera: può servirgli una laurea o un master. Un titolare apre un'attività o assume: gli servono i corsi obbligatori per sé e per i dipendenti.", "La domanda da fare è sempre la stessa: \"Vuole che la faccia chiamare da un tutor, senza impegno?\". Se dice sì, procedi con la segnalazione.", "Puoi dire: che esistono percorsi adatti alla sua situazione, che un tutor lo chiamerà per spiegare tutto, che non c'è impegno. Non devi dire: punteggi garantiti, posti di lavoro sicuri, esami facili, prezzi o sconti che non trovi nei materiali ufficiali.", "Usa solo materiali approvati da UniAC: le schede del Catalogo e quelli che ti manda il gestore. Se vuoi creare un volantino o un post con il nostro nome, fallo vedere prima al gestore.", "Nel prossimo modulo facciamo la prima segnalazione.", "Dall'Area Partner tocca \"Segnala un cliente\". Inserisci nome, cognome e cellulare del cliente, l'email se la hai, e scegli l'area di interesse. Nella nota scrivi in due righe la situazione: \"domanda ATA, vuole punteggio\", \"apre una pizzeria, 3 dipendenti\".", "Il cliente è davanti a te: chiedigli a voce se accetta di essere contattato da un tutor UniAC e, se dice sì, spunta la casella del consenso. Per i dati del cliente il titolare del trattamento è UniAC: tu li raccogli e ce li trasmetti, nel rispetto della Convenzione.", "Tocca Invia. Il contatto arriva subito al tuo gestore, che lo assegna a un tutor della sua squadra. I contatti dei partner hanno la priorità più alta: vengono richiamati per primi.", "Se il cliente vuole leggere con calma, apri il Catalogo, scegli il corso e tocca \"Invia\": riceve la scheda con il tuo codice partner. Se poi acquista online, l'iscrizione resta collegata a te.", "In \"I miei contatti\" trovi lo stato di ogni cliente: Inviata a UniAC, In lavorazione, Iscritto oppure Non proseguito. Lo stato si aggiorna da solo quando il tutor lavora la pratica.", "Se un cliente torna al tuo sportello con domande sul suo percorso, mettilo in contatto con il suo tutor o con il tuo gestore: non dare informazioni su prezzi o requisiti che non hai verificato.", "Nel prossimo modulo: gli acquisti dallo shop e i pagamenti a rate."], "v": "corsi/P3.mp4"}]}, {"t": "Lezione 4 – Acquisti, rate e compensi", "l": [{"t": "Lezione 4 – Acquisti, rate e compensi", "p": ["Per i corsi più semplici, come sicurezza o HACCP, il cliente può acquistare direttamente dal negozio online di UniAC, aprendo la scheda che gli hai mandato con il tuo codice.", "Il cliente paga il prezzo pieno indicato sul sito: non ci sono sconti legati al tuo codice. Il tuo compenso è separato e lo vedi nella sezione Compensi, come per le segnalazioni.", "Molti percorsi, come le lauree, si pagano a rate. In questo caso il tuo compenso matura rata per rata: ogni volta che il cliente paga una rata, in Compensi compare la tua quota su quella rata.", "Se il cliente interrompe i pagamenti, il compenso si ferma alle rate pagate. Per questo è importante segnalare clienti consapevoli e motivati.", "Nel prossimo modulo vediamo compensi e fatture.", "Nella sezione Compensi ogni riga è un incasso: il nome del cliente, il corso, la rata, l'importo del tuo compenso e lo stato, Pagato o Non pagato. In fondo trovi i totali.", "Il compenso si calcola sul prezzo pagato dal cliente, IVA inclusa, con la percentuale della categoria scritta nella tua Convenzione. Facciamo un esempio: corso pagato 100 euro, percentuale 20 per cento, compenso 20 euro IVA inclusa. Ogni partner ha le sue percentuali: quelle che valgono per te sono nella tua Convenzione e le vedi già calcolate in Quotidia.", "Quando vedi compensi maturati e non ancora pagati, emetti fattura secondo le indicazioni del tuo gestore e della Convenzione. UniAC paga entro 30 giorni dalla fattura. Quando il pagamento è fatto, la riga passa a \"Pagato\".", "Se un cliente annulla l'iscrizione ed è rimborsato, il compenso su quell'importo viene stornato, come previsto dalla Convenzione.", "Per qualsiasi dubbio su importi o fatture, il riferimento è sempre il tuo gestore. Nel prossimo modulo: regole e assistenza."], "v": "corsi/P4.mp4"}]}, {"t": "Lezione 5 – Regole e assistenza", "l": [{"t": "Lezione 5 – Regole e assistenza", "p": ["Cinque regole per una collaborazione che funziona. Uno: privacy. Segnali solo clienti che hanno dato il consenso; UniAC è titolare dei loro dati. Due: niente incassi. I clienti pagano solo UniAC o l'ente che eroga il corso, sui conti ufficiali; tu non ricevi acconti né rate. Tre: marchi e materiali. Usi il nome UniAC e Quotidia solo con materiali approvati. Quattro: niente promesse su punteggi, esiti o lavoro. Cinque: nessun reclutamento. Non proponi ad altri CAF o agenzie di diventare partner tramite te: se ne conosci uno interessato, passa il contatto al gestore.", "Il tuo primo riferimento è il gestore UniAC indicato nella Convenzione: per accessi, contatti, compensi e fatture. Per informazioni generali c'è il Numero Verde 800 598 033 e il WhatsApp 327 113 5171. Grazie, e buon lavoro con Quotidia."], "v": "corsi/P5.mp4"}]}], "quiz": [{"q": "Su cosa matura il compenso del partner?", "o": ["Sui nuovi partner che porta", "Sulle iscrizioni dei clienti segnalati"]}, {"q": "Come si calcola?", "o": ["Sul prezzo senza IVA", "Sul prezzo pagato IVA inclusa, con la percentuale della Convenzione"]}, {"q": "Un cliente compra dallo shop con il tuo codice. Quanto paga?", "o": ["Il prezzo pieno", "Il prezzo scontato della tua percentuale"]}, {"q": "Il cliente paga a rate. Quando matura il compenso?", "o": ["Tutto alla prima rata", "Rata per rata, su ogni rata pagata"]}, {"q": "Un CAF può essere anche segnalatore?", "o": ["Sì", "No, sono ruoli separati"]}, {"q": "Chi crea il tuo accesso a Quotidia?", "o": ["Ti registri da solo", "Il gestore UniAC, che ti dà il PIN"]}, {"q": "Un cliente vuole lasciarti un acconto. Cosa fai?", "o": ["Lo incassi e fai la ricevuta", "Non lo prendi: paga solo sui conti ufficiali"]}, {"q": "Entro quanto UniAC paga la fattura?", "o": ["90 giorni", "30 giorni"]}]}};
